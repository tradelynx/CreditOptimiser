[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "creditopt"
version = "0.1.0"
description = "Get more from your Claude subscription: usage dashboard, model router, and auto-compaction nudges for Claude Code."
requires-python = ">=3.9"
readme = "README.md"
dependencies = []

[project.scripts]
creditopt = "creditopt.__main__:main"

[tool.setuptools]
packages = ["creditopt"]

[tool.setuptools.package-data]
creditopt = ["web/*.html"]
