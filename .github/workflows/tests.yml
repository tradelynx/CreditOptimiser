name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python -m creditopt --version
          python -m creditopt route "rename foo to bar in utils.py"
          python -m creditopt run --dry-run --repo . "Add pagination to the orders endpoint"
          python -m creditopt install --repo .
          python run_creditopt.py --help
